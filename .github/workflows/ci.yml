name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cicd.txt

      - name: Build Python package data
        run: python scripts/build_python.py

      - name: Install Python package
        working-directory: packages/python
        run: python -m pip install -e .

      - name: Run Python tests
        working-directory: packages/python
        run: python -m pytest -v

  test-typescript-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json

      - name: Install TypeScript dependencies
        working-directory: packages/typescript
        run: npm ci

      - name: Build Typescript package data
        run: python scripts/build_typescript.py

      - name: Run Typescript tests
        working-directory: packages/typescript
        run: npm run test
