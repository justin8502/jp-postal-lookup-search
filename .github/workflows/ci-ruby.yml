name: Ruby CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-ruby-build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - '3.3'
          - '3.4'
          - '4.0'
    
    container:
      image: ruby:${{ matrix.ruby-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        working-directory: packages/ruby
        run: bundle install

      - name: Run tests
        working-directory: packages/ruby
        run: bundle exec rake
