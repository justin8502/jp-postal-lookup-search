[project]
name = "jp-postal-lookup-search"
description = "Japanese postal code and address lookup with partial matching and normalization"
version = "0.1.0"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Justin Ang", email = "justinang13@gmail.com" }
]
keywords = [
  "japan",
  "postal-code",
  "address",
  "zipcode",
  "ken-all",
  "japanese-address"
]

dependencies = []

[project.urls]
Repository = "https://github.com/justin8502/jp-postal-lookup-search"

[project.optional-dependencies]
dev = [
  "pytest",
  "build",
  "twine"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jp_postal_lookup_search = ["data/*.json"]